name: Warley Canonical QA
on:
  push:
    branches: [feature/approved-ui-website-v1]
    paths: ['index.html', 'styles.css', 'script.js', 'assets/**', 'tests/**', '.github/workflows/warley-qa.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Static and Chromium tests
        run: |
          node tests/smoke.mjs
          node tests/contrast.mjs
          python tests/browser_qa.py
      - name: Attach browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warley-canonical-qa
          path: qa-artifacts/
          retention-days: 3
